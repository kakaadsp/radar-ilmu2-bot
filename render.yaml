services:
  - type: web
    name: radar-ilmu2-bot
    env: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache &&
      php artisan migrate --force
    startCommand: vendor/bin/heroku-php-apache2 public/
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Radar Ilmu 2"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: false   # Set manually in Render dashboard
      - key: APP_URL
        value: https://radar-ilmu2-bot.onrender.com  # Update after deploy
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: id
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: db.sumjwjzcxfrvwfeqyvnw.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        generateValue: false   # Set manually in Render dashboard
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: MOODLE_BASE_URL
        value: https://ilmu2.upnjatim.ac.id
      - key: MOODLE_SERVICE
        value: moodle_mobile_app
      - key: TRIAL_DAYS
        value: "7"
      - key: SUBSCRIPTION_PRICE
        value: "5000"
      # ── Sensitive keys: set manually in Render dashboard ──────────────────
      # TELEGRAM_BOT_TOKEN
      # TELEGRAM_BOT_USERNAME
      # TELEGRAM_ADMIN_CHAT_ID
      # TELEGRAM_WEBHOOK_SECRET
      # CRON_SECRET
